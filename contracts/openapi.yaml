openapi: 3.1.1
info:
  title: 个人网站 API
  version: 1.0.0-design
  description: 首版设计合同；尚无运行中的生产 API。前后端分离，只有 Go 执行业务和权限校验。字段 snake_case，时间 RFC3339 UTC，所有业务响应 no-store。
servers:
- url: /
  description: 同源反向代理入口；API 使用完整 /api/v1 路径
tags:
- name: 公开端
- name: 管理端
- name: 认证
paths:
  /api/v1/public/site:
    get:
      operationId: getPublicSite
      summary: 读取公开站点设置
      description: 读取公开站点设置
      tags:
      - 公开端
      security: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/home:
    get:
      operationId: getPublicHome
      summary: 读取首页组合内容
      description: 每类文章最多 6 篇，精选项目最多 6 个；所有字段只来自公开版本。
      tags:
      - 公开端
      security: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHome'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/articles:
    get:
      operationId: listPublicArticles
      summary: 文章列表与标题摘要搜索
      description: 筛选条件取 AND；first_published_at DESC,id DESC；不搜索正文。返回结果只用当前公开版本。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: trim + Unicode case fold 后按标题摘要字面包含匹配；空 q 按普通列表
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - tech
          - life
        description: ''
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      - name: tag_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCards'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/articles/{slug}:
    get:
      operationId: getPublicArticle
      summary: 读取公开文章
      description: 旧 slug 且内容仍公开时 308 到规范 API 路径，Location 同源；未公开或不存在均 404。Nuxt 同步将页面旧链接重定向到 canonical_path。
      tags:
      - 公开端
      security: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 100
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '308':
          description: 仍公开的旧链接跳转到当前路径
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              required: true
              schema:
                type: string
  /api/v1/public/projects:
    get:
      operationId: listPublicProjects
      summary: 读取公开项目列表
      description: display_order ASC,first_published_at DESC,id DESC。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
        description: ''
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCards'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/projects/{slug}:
    get:
      operationId: getPublicProject
      summary: 读取公开项目详情
      description: 旧 slug 的处理同文章详情；项目不接受评论。
      tags:
      - 公开端
      security: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 100
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '308':
          description: 仍公开的旧链接跳转到当前路径
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              required: true
              schema:
                type: string
  /api/v1/public/profile:
    get:
      operationId: getPublicProfile
      summary: 读取公开个人资料
      description: 读取公开个人资料
      tags:
      - 公开端
      security: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/skills:
    get:
      operationId: listPublicSkills
      summary: 读取公开技能
      description: display_order ASC,id ASC；返回 kind=skill 的详情，相关内容只投影仍公开的目标。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: group
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
        description: ''
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContents'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/taxonomy:
    get:
      operationId: listPublicTaxonomy
      summary: 读取已公开文章使用的分类标签
      description: 仅含公开文章引用的标签；不返回草稿专用标签。公开 DTO 不应包含管理元数据，使用 PublicTaxonomies schema。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - category
          - tag
        description: ''
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - tech
          - life
        description: ''
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTaxonomies'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/sitemap:
    get:
      operationId: listSitemapEntries
      summary: 读取站点地图条目
      description: 包含六个静态公开入口和当前公开文章/项目规范路径；不包含搜索结果、管理端、草稿、旧别名；Nuxt 生成 XML。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitemapEntries'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/public/comments:
    get:
      operationId: listPublicThreads
      summary: 读取公开根留言
      description: 文章范围必须传 content_id；留言板禁止 content_id。根留言按创建时间倒序，回复另行分页，隐藏整组不计入 total。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum:
          - article
          - guestbook
        description: ''
      - name: content_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicThreads'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      operationId: createVisitorComment
      summary: 提交匿名评论或回复
      description: 事务中校验文章、根留言及回复目标仍公开；昵称不能决定站主身份。幂等响应只含公开字段。
      tags:
      - 公开端
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 仅幂等响应重放时返回；前端重新查询当前资源状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitorComment'
            example:
              target:
                scope: guestbook
                content_id: null
              reply_to_id: null
              nickname: 访客
              body: 你好
  /api/v1/public/comments/{id}/replies:
    get:
      operationId: listPublicReplies
      summary: 读取根留言下平铺回复
      description: id 必须是公开根留言；回复按 created_at ASC,id ASC。不可见目标统一 404。
      tags:
      - 公开端
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReplies'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /media/{sha256}/{variant}:
    get:
      operationId: getPublicMedia
      summary: 读取当前公开内容引用的图片
      description: 每次校验当前公开引用；不可公开 404。派生图未就绪时返回原图，Content-Type 按实际文件，前端保持原比例。
      tags:
      - 公开端
      security: []
      parameters:
      - name: sha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: variant
        in: path
        required: true
        schema:
          type: string
          enum:
          - original
          - thumb
          - reading
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/session:
    post:
      operationId: login
      summary: 站主登录
      description: 校验 Origin/Referer 与登录限频。此接口无现存会话、无需 CSRF 或幂等键；不自动重试登录。
      tags:
      - 认证
      security: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description: __Host-site_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
    get:
      operationId: getSession
      summary: 读取当前站主会话
      description: 读取当前站主会话
      tags:
      - 管理端
      security:
      - AdminSession: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    delete:
      operationId: logout
      summary: 退出并使当前会话失效
      description: 校验 CSRF 后删除当前会话并清 Cookie；不使用幂等记录重放失效会话。已失效返回 401，前端仍可清理登录状态。
      tags:
      - 管理端
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/admin/dashboard:
    get:
      operationId: getDashboard
      summary: 读取后台概览
      description: 读取后台概览
      tags:
      - 管理端
      security:
      - AdminSession: []
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/admin/contents:
    get:
      operationId: listAdminContents
      summary: 查询内容与回收站
      description: 默认 lifecycle=active；后台标题优先展示修改稿，仅后台搜索范围内使用。updated_at DESC,id DESC。
      tags:
      - 管理端
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: kind
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ContentKind'
        description: ''
      - name: lifecycle
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - trash
        description: ''
      - name: visibility
        in: query
        required: false
        schema:
          type: string
          enum:
          - published
          - unpublished
        description: ''
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: ''
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 本次请求标识。
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContents'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          $ref: '#/components/responses/Error503'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    post:
      operationId: createContent
