      description: exists=false 表示仓库中对象不存在，其余状态与版本为 null。B/L/R 比较包含完整两份版本与分类快照。
    ConflictSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - open
          - resolving
          - resolved
          - superseded
        local_generation:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        remote_commit:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - content_id
      - state
      - local_generation
      - remote_commit
      - created_at
    Conflict:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - open
          - resolving
          - resolved
          - superseded
        local_generation:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        remote_commit:
          type: string
        created_at:
          type: string
          format: date-time
        base:
          anyOf:
          - $ref: '#/components/schemas/SyncSnapshot'
          - type: 'null'
        local:
          $ref: '#/components/schemas/SyncSnapshot'
        remote:
          $ref: '#/components/schemas/SyncSnapshot'
      required:
      - id
      - content_id
      - state
      - local_generation
      - remote_commit
      - created_at
      - base
      - local
      - remote
    ResolveConflict:
      type: object
      additionalProperties: false
      properties:
        expected_generation:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expected_remote_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        selection:
          type: string
          enum:
          - local
          - remote
          - manual
        action:
          type: string
          enum:
          - save_draft
          - publish
          - withdraw
          - trash
        merged_draft:
          $ref: '#/components/schemas/ContentDraft'
      required:
      - expected_generation
      - expected_remote_digest
      - selection
      - action
      description: manual 必须提供 merged_draft，其余 selection 禁止该字段。默认 UI 选择 save_draft，但协议必须显式提交 action。
      allOf:
      - if:
          properties:
            selection:
              const: manual
          required:
          - selection
        then:
          required:
          - merged_draft
        else:
          not:
            required:
            - merged_draft
