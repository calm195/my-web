  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 一次业务提交生成一个 UUID；重试复用。有效期 24 小时，同键不同载荷返回 409。
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: 由会话接口取得；所有已认证写操作必须提供。
  responses:
    Error400:
      description: 无效 JSON、参数或请求格式
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 未登录或会话失效
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: 无权限、来源或 CSRF 校验失败
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: 对象不存在或当前不可公开
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 版本、幂等、状态或引用冲突
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: 请求或上传超出限制
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: 媒体或内容类型不支持
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: 字段或业务规则校验失败
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: 超过限频，按 Retry-After 重试
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: 服务暂不可用，不能按空列表处理
      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求标识。
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-site_session
      description: HttpOnly Secure SameSite=Lax Path=/；管理写操作另需 X-CSRF-Token。
