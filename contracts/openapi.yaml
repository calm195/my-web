components:
  schemas:
    ContentKind:
      type: string
      enum:
      - article
      - project
      - profile
      - skill
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        message:
          type: string
          maxLength: 500
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              message:
                type: string
                maxLength: 300
            required:
            - path
            - message
        request_id:
          type: string
        current_generation:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        conflict_id:
          type: string
          format: uuid
      required:
      - code
      - message
      - field_errors
      - request_id
    ExpectedGeneration:
      type: object
      additionalProperties: false
      properties:
        expected_generation:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - expected_generation
    Link:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          format: uri
          maxLength: 2048
      required:
      - label
      - url
      description: 允许 https/http；个人公开联系链接另允许 mailto。后端校验协议。
    TaxonomySnapshot:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - category
          - tag
        channel:
          type: string
          enum:
          - tech
          - life
          - all
        name:
          type: string
          minLength: 1
          maxLength: 40
        slug:
          type: string
          maxLength: 80
      required:
      - id
      - kind
      - channel
      - name
      - slug
    AssetRef:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        alt:
          type: string
          maxLength: 300
      required:
      - sha256
      - alt
    TocItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
        level:
          type: integer
          enum:
          - 2
          - 3
      required:
      - id
      - text
      - level
    ArticleDetails:
      type: object
      additionalProperties: false
      properties:
        channel:
          anyOf:
          - type: string
            enum:
            - tech
            - life
          - type: 'null'
      required:
      - channel
    ProjectDetails:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          maxLength: 120
        started_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        ended_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        featured:
          type: boolean
        tech_stack:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 30
      required:
      - role
      - started_on
      - ended_on
      - featured
      - tech_stack
    ProfileDetails:
      type: object
      additionalProperties: false
      properties:
        location:
          type: string
          maxLength: 120
        occupation:
          type: string
          maxLength: 120
      required:
      - location
      - occupation
    SkillDetails:
      type: object
      additionalProperties: false
      properties:
        group_name:
          type: string
          maxLength: 80
      required:
      - group_name
    ArticleDraft:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: article
        title:
          type: string
          maxLength: 120
        summary:
          type: string
          maxLength: 500
        markdown:
          type: string
          maxLength: 200000
        slug:
          anyOf:
          - type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            maxLength: 100
          - type: 'null'
        display_order:
          type: integer
          minimum: -1000000
          maximum: 1000000
        cover:
          anyOf:
          - $ref: '#/components/schemas/AssetRef'
          - type: 'null'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          maxItems: 20
        related_content_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        body_asset_sha256s:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{64}$
          maxItems: 200
        details:
          $ref: '#/components/schemas/ArticleDetails'
        category_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
      required:
      - kind
      - title
      - summary
      - markdown
      - slug
      - display_order
      - cover
      - links
      - related_content_ids
      - body_asset_sha256s
      - details
      - category_id
      - tag_ids
