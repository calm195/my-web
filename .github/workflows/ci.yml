name: P1 quality and local integration
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}
      - name: Prepare system tools and isolated toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl python3-venv
          python3 scripts/dev/bootstrap.py
      - name: Install locked dependencies
        run: |
          sh scripts/dev/with-tools.sh pnpm install:all
          python3 -m venv var/venv
          var/venv/bin/pip install -r scripts/design-requirements.txt
          PLAYWRIGHT_BROWSERS_PATH=var/cache/playwright sh scripts/dev/with-tools.sh pnpm exec playwright install --with-deps firefox
      - name: Check, test and build independently
        run: |
          sh scripts/dev/with-tools.sh pnpm check
          sh scripts/dev/with-tools.sh pnpm test
          sh scripts/dev/with-tools.sh pnpm build
      - name: Real local HTTPS integration
        run: |
          sh scripts/dev/with-tools.sh pnpm test:integration
          sh scripts/dev/with-tools.sh pnpm test:e2e
