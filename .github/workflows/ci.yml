name: Quality and local integration
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}
      - name: Prepare system tools and isolated toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl python3-venv
      - name: Install locked project tools and dependencies
        run: |
          ./dev install
          ./dev exec pnpm --dir tools exec playwright install-deps firefox
      - name: Check, build and verify real HTTPS once
        run: ./dev verify
